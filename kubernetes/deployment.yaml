apiVersion: apps/v1
kind: Deployment

metadata:
  name: credit-default-api
  namespace: credit-default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: credit-default-api

  template:
    metadata:
      labels:
        app: credit-default-api
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: credit-default-sa
      containers:
      - name: credit-default-api
        image: creditdefaultacrdev.azurecr.io/credit-default-api:IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: credit-default-config
        - secretRef:
            name: credit-default-secret
