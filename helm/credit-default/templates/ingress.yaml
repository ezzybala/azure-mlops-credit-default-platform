{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: api-ingress
  namespace: {{ .Release.Namespace }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: credit-default-service

            port:
              number: 80

{{- end }}